<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segment Protocol Scenarios</title>
<style>
:root{
  --navy:#12305a; --navy2:#1d4a85; --ink:#1f2933; --muted:#5b6876; --line:#d5dbe3;
  --bg:#f4f6f9; --card:#ffffff;
  --ok:#2e8b57; --young:#5fb3a8; --noel:#8fa3b8; --abs:#e8902a; --abs2:#a8641c; --ref:#c83b3b;
  --miss:#d62828; --prog:#fff3c4; --done:#e3f3e8; --skip:#f6dede; --coded:#e6ecf5; --idle:#eef1f5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.35;
  display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);overflow:hidden}
header,.app{min-width:0}
header{background:var(--navy);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:14px}
header h1{margin:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header p{margin:0;color:#cfe0f5;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang button{background:transparent;border:1px solid #9fb8d9;color:#fff;border-radius:4px;padding:2px 9px;margin-left:4px;cursor:pointer;font-weight:600}
.lang button.on{background:#fff;color:var(--navy)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 318px;gap:10px;padding:10px;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:0}
#list{overflow:auto;padding:8px}
#list h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:4px 4px 8px}
.sc{border-bottom:1px solid var(--line);padding:6px 4px 7px}
.sc .t{font-weight:600;font-size:13px;color:var(--navy)}
.sc .c{font-size:11.5px;color:var(--muted);margin:1px 0 4px}
.sc button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;margin-right:4px}
.sc button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sc button.bad.on{background:var(--ref);border-color:var(--ref);color:#fff}
.center{display:flex;flex-direction:column;padding:8px;gap:6px}
.banner{min-height:42px;padding:7px 12px;border-radius:6px;background:#eaf1fb;border-left:5px solid var(--navy2);font-weight:600;font-size:14px}
.banner.warn{background:#fdecec;border-left-color:var(--ref)}
.banner.good{background:#e6f5ec;border-left-color:var(--ok)}
.mapwrap{flex:1;min-height:0;position:relative}
svg#map{width:100%;height:100%;display:block}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.controls button{border:none;border-radius:5px;padding:6px 12px;background:var(--navy2);color:#fff;font-size:13px;cursor:pointer;font-weight:600}
.controls button.sec{background:#e3e8ef;color:var(--ink)}
.controls label{color:var(--muted);font-size:12px;margin-left:4px}
.controls .verdict{margin-left:auto;font-weight:700;font-size:12px;padding:3px 9px;border-radius:12px}
.verdict.ok{background:#e6f5ec;color:var(--ok)} .verdict.bad{background:#fdecec;color:var(--ref)}
#legend{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:none;
  grid-template-columns:20px 1fr;gap:3px 7px;font-size:12px;align-items:center;max-width:330px}
#legend.on{display:grid}
.side{display:flex;flex-direction:column;gap:8px;min-height:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.box h3{margin:0 0 5px;font-size:12px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
#situ .st{font-weight:600;margin-bottom:4px}
#situ ul{margin:0;padding-left:17px;font-size:12.5px}
#situ li{margin-bottom:2px}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center}
.counters div{background:var(--idle);border-radius:6px;padding:4px 2px}
.counters b{display:block;font-size:19px;color:var(--navy);line-height:1.15}
.counters span{font-size:10.5px;color:var(--muted);line-height:1.1;display:block}
.quota{height:9px;background:var(--idle);border-radius:5px;margin-top:6px;overflow:hidden;position:relative}
.quota i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:2px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
td.code{font-weight:700;text-align:center;white-space:nowrap}
td.code.bad{color:var(--ref)}
#psuline{margin-top:5px;font-size:12px;font-weight:600}
#psuline.bad{color:var(--ref)}
.grow{flex:1;min-height:70px;display:flex;flex-direction:column}
#log{overflow:auto;font-size:12px;padding:0;margin:0;list-style:none;flex:1;min-height:0}
#log li{padding:3px 0;border-bottom:1px dashed var(--line)}
#log li.alert{color:var(--ref);font-weight:600}
#log li.good{color:var(--ok)}
#disp{max-height:150px;overflow:auto}
body.embed header{display:none}
body.embed{grid-template-rows:minmax(0,1fr)}
body.embed .app{grid-template-columns:minmax(0,1fr) 290px;padding:6px;gap:6px}
body.embed #list{display:none}
body.video #list{display:none}
body.video .app{grid-template-columns:minmax(0,1fr) 330px}
body.video .controls button,body.video .controls label{display:none}
@media (max-width:980px){
  body{overflow:auto;display:block}
  .app{grid-template-columns:1fr}
  .mapwrap{height:62vh}
  #list{max-height:none}
}
</style>
</head>
<body>
<header>
  <h1 id="t_title"></h1>
  <p id="t_sub"></p>
  <div class="lang"><button data-l="fr" class="on">FR</button><button data-l="en">EN</button></div>
</header>
<div class="app">
  <nav class="panel" id="list"></nav>
  <div class="panel center">
    <div class="banner" id="banner"></div>
    <div class="mapwrap"><svg id="map" viewBox="0 0 860 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="PSU map"></svg><div id="legend"></div></div>
    <div class="controls">
      <button id="play"></button>
      <button id="step" class="sec"></button>
      <button id="reset" class="sec"></button>
      <button id="finish" class="sec"></button>
      <button id="legbtn" class="sec"></button>
      <label><span id="t_speed"></span> <input type="range" id="speed" min="1" max="10" value="6"></label>
      <span class="verdict" id="verdict"></span>
    </div>
  </div>
  <div class="side">
    <div class="box" id="situ"></div>
    <div class="box">
      <h3 id="t_count"></h3>
      <div class="counters">
        <div><b id="c_rec">0</b><span id="t_rec"></span></div>
        <div><b id="c_int">0</b><span id="t_int"></span></div>
        <div><b id="c_abs">0</b><span id="t_abs"></span></div>
        <div><b id="c_rev">0</b><span id="t_rev"></span></div>
      </div>
      <div class="quota"><i id="qbar"></i></div>
    </div>
    <div class="box">
      <h3 id="t_disp"></h3>
      <div id="disp"><table><thead><tr><th id="t_seg"></th><th id="t_code"></th><th id="t_recs"></th><th id="t_ints"></th></tr></thead><tbody id="dispb"></tbody></table></div>
      <div id="psuline"></div>
    </div>
    <div class="box grow"><h3 id="t_log"></h3><ul id="log"></ul></div>
  </div>
</div>

<script>
// ===================================================================== text
const L=(fr,en)=>({fr,en});
let lang='fr';
const tx=o=>o==null?'':(typeof o==='string'?o:(o[lang]!==undefined?o[lang]:o.fr));
const TARGET=6;
const UI={
 title:L("Le protocole des segments compacts : scénarios","The compact segment protocol: scenarios"),
 sub:L("Chaque situation du formulaire de disposition, jouée deux fois : la bonne pratique et l'erreur. Cible : 6 entretiens d'enfants de 12–23 mois par PSU.",
       "Each situation on the disposition form, played twice: the right practice and the mistake. Target: 6 interviews of children aged 12–23 months per PSU."),
 list:L("Scénarios","Scenarios"), correct:L("Correct","Correct"), wrong:L("Erreur","Wrong"),
 play:L("▶ Lecture","▶ Play"), pause:L("❚❚ Pause","❚❚ Pause"), step:L("Étape suivante","Next step"), reset:L("Recommencer","Restart"),
 finish:L("Aller à la fin","Jump to end"), leg:L("Légende","Legend"), speed:L("Vitesse","Speed"),
 count:L("Compteurs du PSU","PSU counters"), rec:L("fiches soumises","records submitted"), int:L("entretiens 12–23 m (cible 6)","interviews 12–23 m (target 6)"),
 abs:L("absents à revoir","absent, to revisit"), rev:L("revisites faites","revisits made"),
 disp:L("Disposition (formulaire)","Disposition (form)"), seg:L("Seg.","Seg."), code:L("Code","Code"), recs:L("Fiches","Records"), ints:L("Entr.","Int."),
 log:L("Journal et alertes","Log and alerts"), psu:L("Code PSU","PSU code"), start:L("Appuyez sur Lecture.","Press Play."),
 vok:L("BONNE PRATIQUE","RIGHT PRACTICE"), vbad:L("CE QU'IL NE FAUT PAS FAIRE","WHAT NOT TO DO"),
 centroid:L("centroïde","centroid"), sup:L("Superviseur","Supervisor"), coord:L("Coordination","Coordination"), chief:L("Chef d'équipe","Team chief"),
 outside:L("Hors du PSU","Outside the PSU"), backup:L("PSU de réserve","Backup PSU"),
 o:{C:L("Entretien 12–23 mois (compte pour la cible)","Interview 12–23 months (counts toward the target)"),
    Y:L("Enfant 0–11 mois seulement : entretien hors cible","Child 0–11 months only: interview, not in target"),
    N:L("Pas d'enfant de 0–23 mois : fiche « non éligible »","No child aged 0–23 months: \"not eligible\" record"),
    A:L("Absent : fiche, puis revisite (au plus deux)","Absent: record, then a revisit (at most two)"),
    A2:L("Toujours absent après deux revisites : non-contact","Still absent after two revisits: non-contact"),
    R:L("Refus : fiche, jamais remplacé","Refusal: record, never replaced"),
    V:L("Inoccupé ou non résidentiel : fiche quand même","Vacant or non-residential: record anyway"),
    E:L("Fiche « zone vide » avec GPS et photo","\"Empty area\" record with GPS and photo"),
    M:L("Structure sans fiche (manquée)","Structure with no record (missed)")},
 segleg:{prog:L("Segment en cours","Segment in progress"),done:L("Segment épuisé et déclaré","Segment exhausted and declared"),
    coded:L("Segment codé sans entretien (C à G)","Segment coded without interviews (C to G)"),bad:L("Segment mal travaillé ou non codé","Segment worked wrongly or not coded")},
 foot:L("Démonstration de formation. PSU, segments et ménages simulés. Règles : SOP-01 Sankuru V1.0, formulaire de disposition V2 (20 nov. 2026).",
        "Training demonstration. Simulated PSU, segments and households. Rules: SOP-01 Sankuru V1.0, disposition form V2 (20 Nov 2026).")
};

// ===================================================================== random + geometry
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bil(q,u,v){const[A,B,C,D]=q;const tx_=(1-u)*A.x+u*B.x,ty=(1-u)*A.y+u*B.y,bx=(1-u)*D.x+u*C.x,by=(1-u)*D.y+u*C.y;return{x:(1-v)*tx_+v*bx,y:(1-v)*ty+v*by}}
const BIG=[[7,3,10,5],[9,1,8,11],[4,12,6,2]];
// cfg: num (rows of segment numbers), x0,y0,cw,rh, seed, counts{n:k}, terrain{n:type}, out{n:[outcomes]}, sec{ 'n:i':[rev1,rev2] }, hidden{n:k}, outside:k, label
function makePSU(cfg){
  const R=rng(cfg.seed||20261120), num=cfg.num||BIG, ROWS=num.length, COLS=num[0].length;
  const X0=cfg.x0||40, Y0=cfg.y0||34, CW=cfg.cw||(660/COLS), RH=cfg.rh||(492/ROWS);
  const P=[];
  for(let r=0;r<=ROWS;r++){P.push([]);for(let c=0;c<=COLS;c++){const edge=(r==0||r==ROWS||c==0||c==COLS);const j=edge?18:22;
    P[r].push({x:X0+c*CW+(R()*2-1)*j,y:Y0+r*RH+(R()*2-1)*j})}}
  const segs={},all=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const n=num[r][c];
    segs[n]={n,r,c,quad:[P[r][c],P[r][c+1],P[r+1][c+1],P[r+1][c]],st:[],hid:[],ter:(cfg.terrain||{})[n]||''}}
  const ok=(t,u,v)=>{
    if(Math.abs(u-.5)<.16&&Math.abs(v-.5)<.18)return false;
    if(t==='river'){const m=.3+.3*u;return v>m+.17}
    if(t==='halfswamp')return u<.5;
    return true};
  for(const k in segs){const s=segs[k];const t=s.ter;
    let n=(cfg.counts&&k in cfg.counts)?cfg.counts[k]:((t==='forest'||t==='empty'||t==='g1'||t==='water')?0:5+Math.floor(R()*4));
    let tries=0;
    const place=(cnt,arr,test,flag)=>{let made=0;while(made<cnt&&tries<9000){tries++;const u=.08+R()*.84,v=.08+R()*.84;if(!test(u,v))continue;
      const p=bil(s.quad,u,v);if(all.some(o=>Math.hypot(o.x-p.x,o.y-p.y)<22))continue;
      const st={x:p.x,y:p.y,u,v,seg:s.n,base:'N',flag};arr.push(st);all.push(st);made++}};
    place(n,s.st,(u,v)=>ok(t,u,v));
    if(t==='halfswamp')place(3,s.hid,(u,v)=>u>.64&&!(Math.abs(u-.5)<.16&&Math.abs(v-.5)<.18),'beyond');
    if(cfg.hidden&&cfg.hidden[k])place(cfg.hidden[k],s.hid,(u,v)=>true,'hidden');
    s.st.sort((a,b)=>{const ba=Math.min(2,Math.floor(a.v*3)),bb=Math.min(2,Math.floor(b.v*3));if(ba!=bb)return ba-bb;return ba%2==0?a.u-b.u:b.u-a.u});
    const o=(cfg.out||{})[k];s.st.forEach((x,i)=>{x.i=i;x.base=o?(o[i]||'N'):['N','N','N','C','Y','V','N'][Math.floor(R()*7)];
      const sc=(cfg.sec||{})[k+':'+i];if(sc)x.sec=sc});
  }
  const ring=[...P[0],...P.map(r=>r[COLS]).slice(1),...[...P[ROWS]].reverse().slice(1),...P.map(r=>r[0]).reverse().slice(1)];
  const cent=bil([P[0][0],P[0][COLS],P[ROWS][COLS],P[ROWS][0]],.5,.5);
  const outside=[];
  if(cfg.outside){const bx=X0+COLS*CW+50;for(let i=0;i<cfg.outside;i++)outside.push({x:bx+(i%2)*34+R()*10,y:Y0+60+Math.floor(i/2)*44+R()*10,seg:0,out:true,base:'C'});}
  return {cfg,segs,all,ring,cent,outside,label:cfg.label||''};
}
const centre=s=>bil(s.quad,.5,.5);
const entry=s=>bil(s.quad,.05,.07);

// ===================================================================== step builders
// a builder keeps the running count of interviews so banners land on the right step
function Bld(psu){this.psu=psu;this.s=[];this.int=0;this.quotaSaid=false}
Bld.prototype={
 add(o){this.s.push(o);return this},
 say(t,cls){return this.add({t:'banner',m:t,cls:cls||''})},
 warn(t){return this.add({t:'alert',m:t})},
 note(t){return this.add({t:'log',m:t})},
 arrive(){this.say(L("Arrivée au centroïde du PSU : il sert à naviguer. Personne n'est interrogé ici.","Arrival at the PSU centroid: it is for navigation only. Nobody is interviewed here."));
   return this.add({t:'move',to:this.psu.cent,jump:true})},
 enter(n,a,txt){const s=this.psu.segs[n];this.add({t:'move',to:entry(s),nav:true,a});this.add({t:'seg',n,state:'prog'});
   return this.say(txt||L(`Segment ${n} : le marqueur est dans le polygone. Sens de balayage fixé (serpentin).`,`Segment ${n}: the marker is inside the polygon. Sweep direction fixed (serpentine).`))},
 visit(st,o,a,extra){this.add(Object.assign({t:'move',to:st,a},extra&&extra.mv||{}));this.add(Object.assign({t:'visit',st,o:o||st.base,a},extra||{}));
   if((o||st.base)==='C'){this.int++;if(this.int===TARGET&&!this.quotaSaid&&!(extra&&extra.silent)){this.quotaSaid=true;this.add({t:'quota'})}}return this},
 sweep(n,opts){opts=opts||{};const s=this.psu.segs[n];let list=s.st;if(opts.filter)list=list.filter(opts.filter);
   for(const st of list){if(opts.stopAtTarget&&this.int>=TARGET)break;
     if(opts.each&&opts.each(st,this)===false)continue;this.visit(st,opts.o&&opts.o(st),opts.a)}return this},
 declare(n,code,txt,state){this.add({t:'seg',n,state:state||'done',code});
   const recs=this.psu.segs[n].st.length;
   return this.say(txt||L(`Segment ${n} épuisé : déclaré au chef d'équipe, code ${code}.`,`Segment ${n} exhausted: declared to the team chief, code ${code}.`),'good')},
 code(n,code,sub,state){return this.add({t:'seg',n,state:state||'coded',code,sub})},
 next(n){return this.say(L(`Segment suivant = numéro ${n}, pas le voisin le plus proche. On navigue par numéro.`,`Next segment = number ${n}, not the nearest neighbour. Navigate by number.`))},
 revisits(ns,a){const list=[];for(const n of ns)for(const st of this.psu.segs[n].st)if(st.base==='A')list.push(st);
   if(!list.length)return this;
   this.say(L("Revisites chez les absents avant de clôturer le PSU (au plus deux revisites).","Revisits to absent households before closing the PSU (at most two revisits)."));
   for(const r of [1,2]){for(const st of list){const sec=st.sec||['A','A'];const prev=r===1?'A':sec[0];if(prev!=='A')continue;
     const o=sec[r-1]==='A'&&r===2?'A2':sec[r-1];
     this.add({t:'move',to:st,notrail:true,a});this.add({t:'visit',st,o,rev:r,a});if(o==='C'){this.int++}
     this.note(r===1?(o==='A'?L("1re revisite : toujours absent. Nouvelle fiche, flag revisite.","1st revisit: still absent. New record, revisit flag."):L("1re revisite : ménage trouvé, entretien.","1st revisit: household found, interview."))
                    :(o==='A2'?L("2e revisite : toujours absent. Non-contact documenté, pas de 3e revisite.","2nd revisit: still absent. Documented non-contact, no 3rd revisit."):L("2e revisite : ménage trouvé, entretien.","2nd revisit: household found, interview.")))}}
   return this},
 call(who,m,a){return this.add({t:'call',who,m,a})},
 reply(who,m){return this.add({t:'reply',who,m})},
 photo(a){return this.add({t:'photo',a})},
 walk(n,a){const s=this.psu.segs[n];for(const [u,v] of [[.1,.18],[.9,.2],[.88,.5],[.12,.52],[.12,.82],[.9,.82]])this.add({t:'move',to:bil(s.quad,u,v),a});return this},
 erec(n,a){const s=this.psu.segs[n];return this.add({t:'erec',n,at:bil(s.quad,.9,.82),a})},
 psuCode(code,m,bad){return this.add({t:'psu',code,m,bad})},
 missed(ns){return this.add({t:'missed',ns})},
 done(){return this.s}
};

// ===================================================================== scenarios
const SC=[];
function scen(o){SC.push(o)}
const CL=L("Correct","Correct");

// 1 ------------------------------------------------------------------ basic
scen({id:'basic',title:L("Parcours de base","Basic canvassing"),codes:'A · PSU 1',
 situ:L("La cible de 6 entretiens est atteinte au milieu du segment 2.","The target of 6 interviews is reached halfway through Segment 2."),
 cfg:{seed:11,counts:{1:9,2:12,8:9,9:6},out:{1:['N','C','A','N','V','R','Y','N','C'],2:['N','C','C','N','A','C','V','C','N','R','N','N'],8:['N','C','C','N','C','N','C','V','N'],9:['N','V','C','N','N','Y']},
      sec:{'1:2':['A','C'],'2:4':['C']}},
 rules:{correct:[L("Segment 1 d'abord, puis numéro croissant.","Segment 1 first, then ascending numbers."),
   L("Chaque structure, une fiche, soumise avant d'avancer.","Every structure, one record, submitted before walking on."),
   L("Cible atteinte ? On finit le segment (règle 5.1).","Target reached? Finish the segment (Rule 5.1)."),
   L("Absents : au plus deux revisites.","Absent households: at most two revisits.")],
  wrong:[L("Ne jamais choisir le segment de départ.","Never choose the starting segment."),
   L("Ne jamais quitter un segment à moitié.","Never leave a segment half done."),
   L("Un refus n'est jamais remplacé par le voisin.","A refusal is never replaced by a neighbour."),
   L("Le code « A » doit correspondre à la carte.","Code A must match the map.")]},
 correct(p){const b=new Bld(p);b.arrive();b.enter(1).sweep(1).declare(1,'A');b.next(2).enter(2).sweep(2).declare(2,'A');
   b.revisits([1,2]);b.psuCode('1',L("Conduit selon le protocole","Conducted according to the protocol"));
   b.say(L("PSU clôturé : un code pour chaque segment du 1 au plus haut atteint. Les segments 3 à 12 ne sont pas requis.","PSU closed: a code for every segment from 1 to the highest reached. Segments 3 to 12 are not required."),'good');return b.done()},
 wrong(p){const b=new Bld(p);b.arrive();
   b.enter(9,null,L("ERREUR : départ au segment 9 parce qu'il est près de la route.","ERROR: starts in Segment 9 because it is near the road."));b.add({t:'seg',n:9,state:'bad'});
   b.warn(L("Le segment de départ est toujours le 1. Personne ne le choisit.","The starting segment is always Segment 1. Nobody chooses it."));
   b.sweep(9);b.code(9,'?',null,'bad');

    case 'log':{log(tx(s.m),'');return cb(instant?0:d*.6)}
    case 'quota':{const m=tx(L(`Cible de ${TARGET} atteinte. On finit quand même le segment en cours (règle 5.1).`,`Target of ${TARGET} reached. The current segment is still finished (Rule 5.1).`));setBanner(m,'warn');log(m,'good');return cb(instant?0:d*1.6)}
    case 'seg':{setSeg(s.n,s.state,s.code,s.sub);return cb(instant?0:d*.3)}
    case 'move':{const a=ag(s.a);const mode=s.jump?'jump':s.notrail?'notrail':s.nav?'nav':'';return moveAg(a,s.to,mode,s.nav?d*1.2:d*.55,()=>cb(0))}
    case 'visit':{visitHouse(s.st,s.o,s);return cb(instant?0:d*.45)}
    case 'call':{const a=ag(s.a);const b=badge(s.who);G.fx.innerHTML='';
      const ln=el('line',{x1:a.pos.x,y1:a.pos.y-10,x2:b.x,y2:b.y,stroke:'#1d4a85','stroke-width':2,'stroke-dasharray':'5 4'},G.ui);G.lastLine=ln;
      bubble(a.pos.x,a.pos.y+16,'☎ '+tx(s.m),'#1d4a85');log('☎ '+tx(s.m),'');return cb(instant?0:d*2.6)}
    case 'reply':{if(G.lastLine){G.lastLine.remove();G.lastLine=null}const b=badge(s.who);bubble(b.x-60,b.y+8,'✓ '+tx(s.m),'#2e8b57');log('✓ '+tx(s.m),'good');setBanner(tx(s.m),'good');
      return cb(instant?0:d*3.2)}
    case 'photo':{const a=ag(s.a);const c=el('circle',{cx:a.pos.x,cy:a.pos.y+4,r:4,fill:'none',stroke:'#f5c400','stroke-width':3},G.fx);
      el('rect',{x:a.pos.x+8,y:a.pos.y-2,width:14,height:10,rx:2,fill:'#12305a'},G.mark);el('circle',{cx:a.pos.x+15,cy:a.pos.y+3,r:2.5,fill:'#fff'},G.mark);
      if(!instant){let r=4;const iv=setInterval(()=>{r+=4;c.setAttribute('r',r);c.setAttribute('opacity',Math.max(0,1-r/40));if(r>40){clearInterval(iv);c.remove()}},30)}else c.remove();
      log(tx(L("Photo géolocalisée prise (PH1).","Geotagged photo taken (PH1).")),'');return cb(instant?0:d*.8)}
    case 'erec':{const p=s.at;const g=el('g',{},G.mark);el('path',{d:`M${p.x} ${p.y} l-7 -13 a8 8 0 1 1 14 0 z`,fill:'#1d4a85'},g);el('circle',{cx:p.x,cy:p.y-17,r:3,fill:'#fff'},g);
      cnt.rec++;const dd=segInfo[s.n]=segInfo[s.n]||{rec:0,int:0,code:''};dd.rec++;updCounters();updDisp();
      log(tx(L(`Segment ${s.n} : fiche « zone vide » avec GPS soumise.`,`Segment ${s.n}: "empty area" record with GPS submitted.`)),'good');return cb(instant?0:d*.8)}
    case 'psu':{psuState={code:s.code,m:s.m,bad:s.bad};updDisp();return cb(instant?0:d*.5)}
    case 'missed':{for(const n of s.ns){const sg=PSU.segs[n];if(!sg)continue;for(const st of sg.st)if(!st.o)el('circle',{cx:st.x,cy:st.y,r:13,fill:'none',stroke:'#d62828','stroke-width':3},G.mark)}
      return cb(instant?0:d)}
    case 'reveal':{const sg=PSU.segs[s.n];for(const st of sg.hid){st.g.setAttribute('opacity',1);el('circle',{cx:st.x,cy:st.y,r:13,fill:'none',stroke:'#d62828','stroke-width':3},G.mark)}
      return cb(instant?0:d*1.2)}
    case 'danger':{const sg=PSU.segs[s.n];if(sg.dz)sg.dz.setAttribute('opacity',1);
      const c=centre(sg);const g=el('g',{},G.mark);el('path',{d:`M${c.x+40} ${c.y-34} l13 24 h-26 z`,fill:'#c83b3b'},g);const t=el('text',{x:c.x+40,y:c.y-14,'text-anchor':'middle','font-size':14,'font-weight':800,fill:'#fff'},g);t.textContent='!';
      return cb(instant?0:d)}
    case 'two':{ag('A');ag('B');AG.E&&AG.E.g.remove();delete AG.E;return cb(0)}
    case 'switch':{drawPSU(P2);segInfo={};psuState=null;updDisp();
      log(tx(L("Navigation vers la PSU de réserve 10065. On recommence au segment 1.","Navigating to backup PSU 10065. Start again at Segment 1.")),'good');return cb(instant?0:d*1.5)}
    case 'outv':{// a village outside the drawn PSU
      const vb=svg.viewBox.baseVal;const ox=vb.width-120,oy=330;G.ov=[];
      el('rect',{x:ox-40,y:oy-40,width:150,height:170,rx:10,fill:'#eceae4',stroke:'#b9b4a8','stroke-dasharray':'5 4'},G.seg);
      const t=el('text',{x:ox-34,y:oy-46,'font-size':12,'font-weight':600,fill:'#6b665c'},G.seg);t.textContent=tx(L('Village voisin (hors PSU)','Nearby village (outside PSU)'));
      for(let i=0;i<4;i++){const st={x:ox+(i%2)*50,y:oy+Math.floor(i/2)*55,seg:0};st.g=el('path',{d:housePath(st.x,st.y),fill:'#fff',stroke:'#4a5663','stroke-width':1.4},G.st);G.ov.push(st)}
      return cb(instant?0:d)}
    case 'outvisit':{const st=G.ov[s.i];const a=ag();return moveAg(a,st,'',instant?0:d*.6,()=>{visitHouse(st,'C',{outside:true});cb(instant?0:d*.4)})}
  }
  return cb(0);
}
function loop(){if(!playing)return;const s=steps[idx];if(!s){stop();return}
  run(s,false,w=>{idx++;if(idx>=steps.length){stop();return}timer=setTimeout(loop,w||0)})}
function play(){if(idx>=steps.length)reset();playing=true;btn();loop()}
function stop(){playing=false;clearTimeout(timer);btn()}
function btn(){document.getElementById('play').textContent=tx(playing?UI.pause:UI.play)}
function stepOnce(){stop();const go=()=>{const s=steps[idx];if(!s)return;run(s,false,()=>{idx++;if(['move','seg','log','psu','two'].includes(s.t))go()})};go()}
function finish(){stop();while(idx<steps.length){run(steps[idx],true,()=>{});idx++}}

// ===================================================================== side panels, list, i18n
function renderSitu(){const r=cur.rules[variant];const box=document.getElementById('situ');
  box.innerHTML=`<h3>${tx(cur.title)} · ${tx(typeof cur.codes==='string'?cur.codes:cur.codes)}</h3><div class="st">${tx(cur.situ)}</div><ul>${r.map(x=>`<li>${tx(x)}</li>`).join('')}</ul>`;
  const v=document.getElementById('verdict');v.textContent=tx(variant==='correct'?UI.vok:UI.vbad);v.className='verdict '+(variant==='correct'?'ok':'bad')}
function renderList(){const nav=document.getElementById('list');nav.innerHTML=`<h2>${tx(UI.list)}</h2>`;
  SC.forEach((s,i)=>{const d=document.createElement('div');d.className='sc';
    d.innerHTML=`<div class="t">${i+1}. ${tx(s.title)}</div><div class="c">${tx(typeof s.codes==='string'?s.codes:s.codes)}</div>`;
    for(const v of ['correct','wrong']){const b=document.createElement('button');b.className=(v==='correct'?'ok':'bad')+(s===cur&&v===variant?' on':'');
      b.textContent=tx(v==='correct'?UI.correct:UI.wrong);b.onclick=()=>{cur=s;variant=v;renderList();reset();setUrl()};d.appendChild(b)}
    nav.appendChild(d)})}
function setUrl(){try{const q=new URLSearchParams(location.search);q.set('s',cur.id);q.set('v',variant);q.set('lang',lang);history.replaceState(null,'','?'+q)}catch(e){}}
function renderLegend(){const lg=document.getElementById('legend');lg.innerHTML='';
  const add=(sw,label)=>{const a=document.createElement('div');a.innerHTML=sw;lg.appendChild(a);const b=document.createElement('div');b.textContent=label;lg.appendChild(b)};
  const hs=(f,dash,ring)=>`<svg width="20" height="18" viewBox="-10 -10 20 18"><path d="${housePath(0,0,1)}" fill="${f}" stroke="#2b3640" stroke-width="1.4" ${dash?'stroke-dasharray="3 2"':''}/>${ring?'<circle r="8.5" cy="-1" fill="none" stroke="#d62828" stroke-width="2.4"/>':''}</svg>`;
  for(const k of ['C','Y','N','A','A2','R','V'])add(hs(COL[k],k==='V'),tx(UI.o[k]));
  add('<svg width="20" height="18" viewBox="-10 -16 20 20"><path d="M0 2 l-6 -11 a7 7 0 1 1 12 0 z" fill="#1d4a85"/></svg>',tx(UI.o.E));
  add(hs('#fff',false,true),tx(UI.o.M));
  const sq=c=>`<svg width="20" height="16"><rect x="1" y="1" width="18" height="14" fill="${c}" stroke="#7d8b99"/></svg>`;
  for(const k of ['prog','done','coded','bad'])add(sq(SEGF[k]),tx(UI.segleg[k]))}
function applyLang(){document.documentElement.lang=lang;
  document.getElementById('t_title').textContent=tx(UI.title);document.getElementById('t_sub').textContent=tx(UI.sub);
  for(const k of ['step','reset','finish']){document.getElementById(k).textContent=tx(UI[k])}
  document.getElementById('legbtn').textContent=tx(UI.leg);
  for(const k of ['speed','count','rec','int','abs','rev','disp','seg','code','recs','ints','log'])document.getElementById('t_'+k).textContent=tx(UI[k]);
  btn();renderLegend();renderList()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));applyLang();reset();setUrl()});
document.getElementById('play').onclick=()=>playing?stop():play();
document.getElementById('step').onclick=stepOnce;
document.getElementById('reset').onclick=reset;
document.getElementById('finish').onclick=finish;
document.getElementById('legbtn').onclick=()=>document.getElementById('legend').classList.toggle('on');
const q=new URLSearchParams(location.search);
if(q.get('lang')==='en'){lang='en';document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x.dataset.l==='en'))}
if(q.get('embed'))document.body.classList.add('embed');
if(q.get('video'))document.body.classList.add('video');
if(q.get('speed'))document.getElementById('speed').value=q.get('speed');
const want=SC.find(s=>s.id===q.get('s')||s.id===({correct:'basic',errors:'basic'})[q.get('mode')]);if(want)cur=want;
if(q.get('v')==='wrong'||q.get('mode')==='errors')variant='wrong';
applyLang();reset();
if(q.get('final'))finish();else if(q.get('autoplay'))play();
</script>
