<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segment Protocol Demo</title>
<style>
:root{
  --navy:#12305a; --navy2:#1d4a85; --ink:#1f2933; --muted:#5b6876; --line:#d5dbe3;
  --bg:#f4f6f9; --card:#ffffff;
  --ok:#2e8b57; --ok-l:#d8efe1; --young:#5fb3a8; --noel:#8fa3b8; --abs:#e8902a; --ref:#c83b3b;
  --vac:#ffffff; --miss:#d62828; --prog:#fff3c4; --done:#e3f3e8; --skip:#f1e1e1; --idle:#eef1f5;
  --yellow:#f5c400;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
header{background:var(--navy);color:#fff;padding:18px 24px 14px}
header h1{margin:0;font-size:26px;letter-spacing:.2px}
header p{margin:4px 0 0;color:#cfe0f5;font-size:15px}
.lang{float:right}
.lang button{background:transparent;border:1px solid #9fb8d9;color:#fff;border-radius:4px;padding:3px 10px;margin-left:4px;cursor:pointer;font-weight:600}
.lang button.on{background:#fff;color:var(--navy)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px 6px 0 0;padding:9px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--navy2);color:#fff;border-color:var(--navy2);font-weight:600}
.tabs button.bad.on{background:var(--ref);border-color:var(--ref)}
.tabs button.whole.on{background:#6b4fa0;border-color:#6b4fa0}
main{display:flex;gap:16px;flex-wrap:wrap;padding:0 24px 18px}
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:10px;flex:1 1 760px;min-width:0}
svg#map{width:100%;height:auto;display:block}
.banner{min-height:48px;margin:6px 4px 8px;padding:10px 14px;border-radius:6px;background:#eaf1fb;border-left:5px solid var(--navy2);font-weight:600}
.banner.warn{background:#fdecec;border-left-color:var(--ref)}
.banner.good{background:#e6f5ec;border-left-color:var(--ok)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 4px 2px}
.controls button{border:none;border-radius:5px;padding:8px 14px;background:var(--navy2);color:#fff;font-size:14px;cursor:pointer;font-weight:600}
.controls button.sec{background:#e3e8ef;color:var(--ink)}
.controls label{color:var(--muted);font-size:13px;margin-left:6px}
.side{flex:0 1 380px;display:flex;flex-direction:column;gap:12px;min-width:280px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.box h3{margin:0 0 8px;font-size:15px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.counters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.counters div{background:var(--idle);border-radius:6px;padding:6px 4px}
.counters b{display:block;font-size:24px;color:var(--navy)}
.counters span{font-size:12px;color:var(--muted)}
.quota{height:12px;background:var(--idle);border-radius:6px;margin-top:10px;overflow:hidden}
.quota i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.legend{display:grid;grid-template-columns:22px 1fr;gap:5px 8px;font-size:13px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
td.code{font-weight:700;font-size:15px;text-align:center}
td.code.bad{color:var(--ref)}
#log{max-height:200px;overflow:auto;font-size:13px;padding-left:0;margin:0;list-style:none}
#log li{padding:4px 0;border-bottom:1px dashed var(--line)}
#log li.alert{color:var(--ref);font-weight:600}
#log li.good{color:var(--ok)}
.rules{padding:0 24px 24px}
.rules .box{columns:2 340px;column-gap:28px}
.rules li{margin-bottom:6px;break-inside:avoid}
.foot{color:var(--muted);font-size:12px;padding:0 24px 20px}
@media (max-width:700px){header h1{font-size:20px}main,.tabs,.rules,.foot{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header>
  <div class="lang"><button data-l="fr" class="on">FR</button><button data-l="en">EN</button></div>
  <h1 id="t_title"></h1>
  <p id="t_sub"></p>
</header>
<div class="tabs">
  <button data-m="correct" class="on" id="tab_correct"></button>
  <button data-m="errors" class="bad" id="tab_errors"></button>
  <button data-m="whole" class="whole" id="tab_whole"></button>
</div>
<main>
  <div class="mapcard">
    <div class="banner" id="banner"></div>
    <svg id="map" viewBox="0 0 800 560" role="img" aria-label="PSU map"></svg>
    <div class="controls">
      <button id="play"></button>
      <button id="step" class="sec"></button>
      <button id="reset" class="sec"></button>
      <button id="finish" class="sec"></button>
      <label><span id="t_speed"></span> <input type="range" id="speed" min="1" max="10" value="5"></label>
    </div>
  </div>
  <div class="side">
    <div class="box">
      <h3 id="t_count"></h3>
      <div class="counters">
        <div><b id="c_rec">0</b><span id="t_rec"></span></div>
        <div><b id="c_int">0</b><span id="t_int"></span></div>
        <div><b id="c_abs">0</b><span id="t_abs"></span></div>
      </div>
      <div class="quota"><i id="qbar"></i></div>
    </div>
    <div class="box">
      <h3 id="t_disp"></h3>
      <table><thead><tr><th id="t_seg"></th><th id="t_code"></th><th id="t_recs"></th><th id="t_ints"></th></tr></thead><tbody id="disp"></tbody></table>
      <div id="dispnote" style="font-size:12px;color:var(--muted);margin-top:6px"></div>
    </div>
    <div class="box">
      <h3 id="t_log"></h3>
      <ul id="log"></ul>
    </div>
    <div class="box">
      <h3 id="t_leg"></h3>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</main>
<section class="rules"><div class="box"><h3 id="t_rules"></h3><ol id="rules"></ol></div></section>
<div class="foot" id="t_foot"></div>

// ---------------------------------------------------------------- geometry
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(20261118);
const COLS=4, ROWS=3, X0=40, Y0=34, CW=180, RH=164;
const P=[];
for(let r=0;r<=ROWS;r++){P.push([]);for(let c=0;c<=COLS;c++){
  const edge=(r==0||r==ROWS||c==0||c==COLS);
  const j=edge?26:30;
  P[r].push({x:X0+c*CW+(R()*2-1)*j, y:Y0+r*RH+(R()*2-1)*j});
}}
const NUM=[[7,3,10,5],[9,1,8,11],[4,12,6,2]];
const segs={};
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const A=P[r][c],B=P[r][c+1],C=P[r+1][c+1],D=P[r+1][c];
  segs[NUM[r][c]]={n:NUM[r][c],r,c,quad:[A,B,C,D],st:[]};
}
function bil(q,u,v){const[A,B,C,D]=q;const tx=(1-u)*A.x+u*B.x,ty=(1-u)*A.y+u*B.y,bx=(1-u)*D.x+u*C.x,by=(1-u)*D.y+u*C.y;return{x:(1-v)*tx+v*bx,y:(1-v)*ty+v*by}}
function centre(s){return bil(s.quad,.5,.5)}
const COUNT={1:9,2:12,8:10,10:0};
const BASE=['N','N','N','N','N','N','N','C','Y','A','V','V','R','N'];
let all=[];
for(const k in segs){
  const s=segs[k]; const n=(k in COUNT)?COUNT[k]:5+Math.floor(R()*4);
  let tries=0;
  while(s.st.length<n && tries<4000){tries++;
    const u=.1+R()*.8, v=.1+R()*.8, p=bil(s.quad,u,v);
    if(Math.abs(u-.5)<.17&&Math.abs(v-.5)<.2)continue; // keep the segment number readable
    if(all.some(o=>Math.hypot(o.x-p.x,o.y-p.y)<23))continue;
    const st={x:p.x,y:p.y,u,v,seg:s.n,base:BASE[Math.floor(R()*BASE.length)],second:R()<.5?'C':'N'};
    s.st.push(st);all.push(st);
  }
  s.st.sort((a,b)=>{const ba=Math.min(2,Math.floor(a.v*3)),bb=Math.min(2,Math.floor(b.v*3));if(ba!=bb)return ba-bb;return ba%2==0?a.u-b.u:b.u-a.u});
  s.st.forEach((t,i)=>t.i=i);
}
// scripted outcomes so the story is the same every time
const S1=['N','C','A','N','V','R','Y','N','C']; segs[1].st.forEach((t,i)=>{t.base=S1[i]}); segs[1].st[2].second='A2';
const S2=['N','C','N','A','C','V','N','C','N','R','C','N']; segs[2].st.forEach((t,i)=>{t.base=S2[i]}); segs[2].st[3].second='C';
const S8=['N','C','C','N','C','N','C','V','A','N']; segs[8].st.forEach((t,i)=>{t.base=S8[i]});
const S9=['N','V','C']; segs[9].st.forEach((t,i)=>{if(i<3)t.base=S9[i]});
const CENT=bil([P[0][0],P[0][COLS],P[ROWS][COLS],P[ROWS][0]],.5,.5);

// ---------------------------------------------------------------- scenarios
function entry(s){return bil(s.quad,.04,.06)}
function build(mode){
  const L=[];
  L.push({t:'banner',k:'arrive',cls:''});
  L.push({t:'move',to:CENT,jump:true});
  if(mode==='correct'){
    for(const n of [1,2]){
      const s=segs[n];
      if(n===2){L.push({t:'banner',k:'next',a:2,cls:''});}
      L.push({t:'move',to:entry(s),nav:true});
      L.push({t:'seg',n,state:'prog'});
      L.push({t:'banner',k:'enter',a:n,cls:''});
      for(const st of s.st){L.push({t:'move',to:st});L.push({t:'visit',st,o:st.base});}
      L.push({t:'seg',n,state:'done',code:'A'});
      L.push({t:'banner',k:'segdone',a:n,b:s.st.length,cls:'good'});
    }
    L.push({t:'banner',k:'revisit',cls:''});
    for(const n of [1,2])for(const st of segs[n].st)if(st.base==='A'){L.push({t:'move',to:st,notrail:true});L.push({t:'visit',st,o:st.second,second:true});}
    L.push({t:'banner',k:'closed',cls:'good'});
    L.push({t:'note',k:'qnote'});
  }
  if(mode==='errors'){
    const s9=segs[9];
    L.push({t:'move',to:entry(s9),nav:true});
    L.push({t:'seg',n:9,state:'bad',code:'?'});
    L.push({t:'alert',k:'e_start'});
    for(const st of s9.st.slice(0,3)){L.push({t:'move',to:st});L.push({t:'visit',st,o:st.base});}
    const s1=segs[1];
    L.push({t:'move',to:entry(s1),nav:true});
    L.push({t:'seg',n:1,state:'bad',code:'A'});
    const west=s1.st.filter(t=>t.u<.5);
    for(const st of west){L.push({t:'move',to:st});
      if(st.base==='R'){L.push({t:'visit',st,o:'R'});L.push({t:'alert',k:'e_repl'});}
      else L.push({t:'visit',st,o:st.base});}
    L.push({t:'alert',k:'e_half',a:s1.st.length-west.length});
    const s8=segs[8];
    L.push({t:'move',to:entry(s8),nav:true});
    L.push({t:'seg',n:8,state:'bad',code:'A'});
    L.push({t:'alert',k:'e_jump'});
    L.push({t:'quitAtQuota',seg:8});
    L.push({t:'missed'});
    L.push({t:'banner',k:'e_end',cls:'warn'});
    L.push({t:'note',k:'e_code'});
  }
  if(mode==='whole'){
    L.push({t:'banner',k:'w_start',cls:''});
    L.push({t:'note',k:'w_note'});
    for(let r=0;r<ROWS;r++){
      const cols=[...Array(COLS).keys()]; if(r%2)cols.reverse();
      for(const c of cols){
        const s=segs[NUM[r][c]];
        L.push({t:'seg',n:s.n,state:'prog'});
        for(const st of s.st){L.push({t:'move',to:st,fast:true});L.push({t:'visit',st,o:st.base,fast:true});}
        L.push({t:'seg',n:s.n,state:'done',code:'auto'});
        L.push({t:'banner',k:'w_seg',a:s.n,cls:'',fast:true});
      }
    }
    L.push({t:'banner',k:'revisit',cls:''});
    for(const st of all)if(st.base==='A'){L.push({t:'move',to:st,notrail:true,fast:true});L.push({t:'visit',st,o:st.second,second:true,fast:true});}
    L.push({t:'recode'});
    L.push({t:'banner',k:'w_done',cls:'good'});
  }
  return L;
}

// ---------------------------------------------------------------- drawing
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('map');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e}
const COL={C:'var(--ok)',Y:'var(--young)',N:'var(--noel)',A:'var(--abs)',A2:'#b06a1c',R:'var(--ref)',V:'#ffffff',U:'#ffffff'};
const SEGF={idle:'var(--idle)',prog:'var(--prog)',done:'var(--done)',bad:'var(--skip)'};
let gSeg,gLab,gTrail,gSt,gMan,gMiss;
function housePath(x,y,k){k=k||1;return`M${x-7*k} ${y+6*k}L${x-7*k} ${y-1*k}L${x} ${y-8*k}L${x+7*k} ${y-1*k}L${x+7*k} ${y+6*k}Z`}
function drawBase(){
  svg.innerHTML='';
  const defs=el('defs',{});
  const pat=el('pattern',{id:'trees',width:22,height:22,patternUnits:'userSpaceOnUse'},defs);
  el('rect',{width:22,height:22,fill:'#dcebd6'},pat);
  el('path',{d:'M11 3 L17 14 L5 14 Z',fill:'#7fae73'},pat);
  el('rect',{x:10,y:14,width:2,height:4,fill:'#6b5a3e'},pat);
  const mk=el('marker',{id:'arr',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0 0L10 5L0 10z',fill:'#1d4a85'},mk);
  gSeg=el('g',{});gLab=el('g',{});gTrail=el('g',{});gSt=el('g',{});gMiss=el('g',{});gMan=el('g',{});
  for(const k in segs){const s=segs[k];
    s.poly=el('polygon',{points:s.quad.map(p=>p.x+','+p.y).join(' '),fill:s.st.length?SEGF.idle:'url(#trees)',stroke:'#7d8b99','stroke-width':1.6},gSeg);
    const c=centre(s);
    s.labelC=el('circle',{cx:c.x,cy:c.y,r:17,fill:'#fff',stroke:'#12305a','stroke-width':2,opacity:.92},gLab);
    s.labelT=el('text',{x:c.x,y:c.y+6,'text-anchor':'middle','font-size':18,'font-weight':700,fill:'#12305a'},gLab);s.labelT.textContent=s.n;
    if(!s.st.length){const f=el('text',{x:c.x,y:c.y+36,'text-anchor':'middle','font-size':13,'font-weight':600,fill:'#3d6b34'},gLab);f.textContent=T[lang].forest;}
    s.codeT=el('text',{x:c.x+22,y:c.y-12,'font-size':16,'font-weight':800,fill:'#12305a'},gLab);
  }
  el('polygon',{points:[...P[0],...P.map(r=>r[COLS]).slice(1),...[...P[ROWS]].reverse().slice(1),...P.map(r=>r[0]).reverse().slice(1)].map(p=>p.x+','+p.y).join(' '),fill:'none',stroke:'#12305a','stroke-width':4},gSeg);
  for(const st of all){st.g=el('path',{d:housePath(st.x,st.y),fill:'#fff',stroke:'#4a5663','stroke-width':1.4},gSt);}
  // centroid
  el('circle',{cx:CENT.x,cy:CENT.y,r:5,fill:'#12305a'},gLab);
  const ct=el('text',{x:CENT.x-62,y:CENT.y+4,'font-size':11,fill:'#12305a'},gLab);ct.textContent=lang==='fr'?'centroïde':'centroid';
  // enumerator
  gMan.innerHTML='';
  el('circle',{cx:0,cy:-14,r:5.5,fill:'#12305a'},gMan);
  el('path',{d:'M-7 6 L-6 -6 Q0 -10 6 -6 L7 6 Z',fill:'#c9a463',stroke:'#12305a','stroke-width':1.2},gMan);
  el('rect',{x:4,y:-4,width:7,height:10,rx:1.5,fill:'#12305a'},gMan);
  gMan.setAttribute('transform',`translate(${CENT.x},${CENT.y-40})`);
}
// ---------------------------------------------------------------- state & player
let lang='fr', mode='correct', steps=[], idx=0, timer=null, playing=false;
let pos={x:CENT.x,y:CENT.y-40}, cnt={rec:0,int:0,abs:0}, segInfo={}, trail=null, quotaShown=false;
function reset(){
  stop(); drawBase(); steps=build(mode); idx=0; pos={x:CENT.x,y:CENT.y-40};
  cnt={rec:0,int:0,abs:0}; segInfo={}; trail=null; quotaShown=false;
  for(const st of all){st.o=null;}
  document.getElementById('log').innerHTML=''; document.getElementById('dispnote').textContent='';
  setBanner(T[lang].start,''); updCounters(); updDisp();
}
function setBanner(txt,cls){const b=document.getElementById('banner');b.textContent=txt;b.className='banner '+(cls||'')}
function log(txt,cls){const li=document.createElement('li');li.textContent=txt;if(cls)li.className=cls;const ul=document.getElementById('log');ul.prepend(li)}
function txt(k,a,b){const v=T[lang][k];return typeof v==='function'?v(a,b):v}
function updCounters(){
  document.getElementById('c_rec').textContent=cnt.rec;
  document.getElementById('c_int').textContent=cnt.int;
  document.getElementById('c_abs').textContent=cnt.abs;
  document.getElementById('qbar').style.width=Math.min(100,cnt.int/5*100)+'%';
}
function updDisp(){
  const tb=document.getElementById('disp');tb.innerHTML='';
  Object.keys(segInfo).map(Number).sort((a,b)=>a-b).forEach(n=>{const d=segInfo[n];
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${n}</td><td class="code ${d.bad?'bad':''}">${d.code||'…'}</td><td>${d.rec}</td><td>${d.int}</td>`;tb.appendChild(tr)});
}
function setSeg(n,state,code){
  const s=segs[n]; s.poly.setAttribute('fill',s.st.length?SEGF[state]:'url(#trees)');
  segInfo[n]=segInfo[n]||{rec:0,int:0,code:''};
  if(state==='bad')segInfo[n].bad=true;
  if(code){
    if(code==='auto'){const d=segInfo[n];code=!s.st.length?'D':(d.int+d.young>0?'B':'C');if(!s.st.length){d.rec=0}}
    segInfo[n].code=code; s.codeT.textContent=code==='?'?'':code;
    s.codeT.setAttribute('fill',segInfo[n].bad?'#c83b3b':'#12305a');
  }
  updDisp();
}
function visit(st,o,second){
  const prev=st.o; st.o=o; st.g.setAttribute('fill',COL[o]); st.g.setAttribute('stroke',o==='V'?'#4a5663':'#2b3640');
  if(o==='V'){st.g.setAttribute('stroke-dasharray','3 2')}
  const d=segInfo[st.seg]=segInfo[st.seg]||{rec:0,int:0,young:0,code:''};
  d.young=d.young||0;
  if(!second){cnt.rec++;d.rec++;}
  if(o==='A')cnt.abs++;
  if(second&&prev==='A')cnt.abs--;
  if(o==='C'){cnt.int++;d.int++;}
  if(o==='Y')d.young++;
  if(second){st.g.setAttribute('stroke-width',3)}
  updCounters();updDisp();
  if(!quotaShown&&cnt.int>=5&&mode!=='errors'){quotaShown=true;setBanner(txt('quota'),'warn');log(txt('quota'),'good');}
}
function moveTo(to,nav,dur,done){
  const from={...pos}, target={x:to.x,y:to.y-14};
  if(nav==='skip'){const t0=performance.now();const fin=()=>{pos=target;gMan.setAttribute('transform',`translate(${pos.x},${pos.y})`);trail=null;done()};
    if(dur<=0)return fin();
    const g=now=>{const k=Math.min(1,(now-t0)/dur);pos={x:from.x+(target.x-from.x)*k,y:from.y+(target.y-from.y)*k};gMan.setAttribute('transform',`translate(${pos.x},${pos.y})`);if(k<1)requestAnimationFrame(g);else fin()};requestAnimationFrame(g);return}
  if(!trail||nav){trail=el('polyline',{points:'',fill:'none',stroke:nav?'#1d4a85':'#12305a','stroke-width':nav?2:1.6,'stroke-dasharray':nav?'7 5':'none',opacity:.75,'marker-end':nav?'url(#arr)':''},gTrail);trail._pts=[`${from.x},${from.y+14}`];}
  const t0=performance.now();
  function f(now){const k=Math.min(1,(now-t0)/dur);pos={x:from.x+(target.x-from.x)*k,y:from.y+(target.y-from.y)*k};
    gMan.setAttribute('transform',`translate(${pos.x},${pos.y})`);
    if(k<1)requestAnimationFrame(f);else{trail._pts.push(`${to.x},${to.y}`);trail.setAttribute('points',trail._pts.join(' '));if(nav)trail=null;done()}}
  if(dur<=0){pos=target;gMan.setAttribute('transform',`translate(${pos.x},${pos.y})`);trail._pts.push(`${to.x},${to.y}`);trail.setAttribute('points',trail._pts.join(' '));if(nav)trail=null;done();return}
  requestAnimationFrame(f);
}
function speedMs(fast){const v=+document.getElementById('speed').value;const base=1300-v*115;return fast?base*.35:base}
function run(i,instant,cb){
  const s=steps[i]; if(!s){cb&&cb(true);return}
  const d=instant?0:speedMs(s.fast);
  switch(s.t){
    case 'banner':{const m=txt(s.k,s.a,s.b);setBanner(m,s.cls);log(m,s.cls==='good'?'good':'');return cb(false,instant?0:Math.max(d*1.6,s.fast?250:900))}
    case 'note':{document.getElementById('dispnote').textContent=txt(s.k);return cb(false,0)}
    case 'alert':{const m=txt(s.k,s.a);setBanner(m,'warn');log(m,'alert');return cb(false,instant?0:d*2.2)}
    case 'seg':{setSeg(s.n,s.state,s.code);return cb(false,instant?0:d*.3)}
    case 'move':{if(s.notrail){return moveTo(s.to,'skip',d*.8,()=>cb(false,0))}return moveTo(s.to,s.nav||s.jump,s.jump?0:(s.nav?d*1.2:d*.6),()=>cb(false,0))}
    case 'recode':{for(const k in segs){const sg=segs[k],dd=segInfo[k];if(!dd)continue;const c=!sg.st.length?'D':((dd.int+(dd.young||0))>0?'B':'C');dd.code=c;sg.codeT.textContent=c}updDisp();return cb(false,0)}
    case 'visit':{visit(s.st,s.o,s.second);return cb(false,instant?0:d*.45)}
    case 'quitAtQuota':{ // insert visits until quota reached, then leave
      const seg=segs[s.seg];const extra=[];let q=cnt.int,left=0;
      for(const st of seg.st){if(q>=5){left++;continue}extra.push({t:'move',to:st},{t:'visit',st,o:st.base});if(st.base==='C')q++;}
      extra.push({t:'alert',k:'e_quit',a:seg.st.length-extra.length/2});
      steps.splice(i+1,0,...extra);return cb(false,0)}
    case 'missed':{for(const n of [1,8]){for(const st of segs[n].st)if(!st.o){el('circle',{cx:st.x,cy:st.y,r:13,fill:'none',stroke:'var(--miss)','stroke-width':3},gMiss)}}
      for(const n of [2,3,4,5,6,7]){if(segs[n].st.length){segs[n].poly.setAttribute('fill','var(--skip)');segs[n].codeT.textContent='?';segs[n].codeT.setAttribute('fill','#c83b3b')}}
      return cb(false,instant?0:d)}
  }
}
function loop(){ if(!playing)return;
  run(idx,false,(end,wait)=>{idx++; if(end||idx>=steps.length){stop();return} timer=setTimeout(loop,wait||0)});
}
function play(){if(idx>=steps.length)reset();playing=true;btn();loop()}
function stop(){playing=false;clearTimeout(timer);btn()}
function btn(){document.getElementById('play').textContent=playing?T[lang].pause:T[lang].play}
function stepOnce(){stop();if(idx>=steps.length)return;
  // run until one visible action (a visit, alert or banner) has happened
  const go=()=>run(idx,false,(end,w)=>{const s=steps[idx];idx++;if(idx<steps.length&&s&&(s.t==='move'||s.t==='seg'||s.t==='note'||s.t==='quitAtQuota'))go()});go()}
function finish(){stop();while(idx<steps.length){run(idx,true,()=>{});idx++}}

// ---------------------------------------------------------------- i18n & init
function applyLang(){
  document.documentElement.lang=lang;
  const t=T[lang];
  for(const k of ['title','sub','tab_correct','tab_errors','tab_whole','step','reset','finish','speed','count','rec','int','abs','disp','seg','code','recs','ints','log','leg','rules','foot']){
    const e=document.getElementById(k.startsWith('tab_')?k:'t_'+k)||document.getElementById(k); if(e)e.textContent=t[k];}
  document.getElementById('t_foot').textContent=t.foot;
  btn();
  const lg=document.getElementById('legend');lg.innerHTML='';
  const add=(sw,label)=>{const d=document.createElement('div');d.innerHTML=sw;lg.appendChild(d);const s=document.createElement('div');s.textContent=label;lg.appendChild(s)};
  const hs=(f,dash,ring)=>`<svg width="20" height="18" viewBox="-10 -10 20 18"><path d="${housePath(0,0,1)}" fill="${f}" stroke="#2b3640" stroke-width="1.4" ${dash?'stroke-dasharray="3 2"':''}/>${ring?'<circle r="8.5" cy="-1" fill="none" stroke="#d62828" stroke-width="2.4"/>':''}</svg>`;
  for(const k of ['C','Y','N','A','A2','R','V'])add(hs(COL[k],k==='V'),t.o[k]);
  add(hs('#fff',false,true),t.o.M);
  const sq=c=>`<svg width="20" height="16"><rect x="1" y="1" width="18" height="14" fill="${c}" stroke="#7d8b99"/></svg>`;
  add(sq('var(--prog)'),t.segleg.prog);add(sq('var(--done)'),t.segleg.done);add(sq('var(--skip)'),t.segleg.bad);
  document.getElementById('rules').innerHTML=t.rulesList.map(r=>`<li>${r}</li>`).join('');
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));applyLang();reset()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));reset()});
document.getElementById('play').onclick=()=>playing?stop():play();
document.getElementById('step').onclick=stepOnce;
document.getElementById('reset').onclick=reset;
document.getElementById('finish').onclick=finish;
const q=new URLSearchParams(location.search);
if(q.get('lang')==='en'){lang='en';document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x.dataset.l==='en'))}
if(q.get('mode')){mode=q.get('mode');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.m===mode))}
applyLang();reset();
if(q.get('final'))finish();
</script>
</body>
