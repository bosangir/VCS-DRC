<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcourir le PSU</title>
<style>
:root{--navy:#12305a;--navy2:#1d4a85;--ink:#1f2933;--muted:#5b6876;--line:#d5dbe3;--soft:#f3f5f8;--ok:#2e8b57;--bad:#c0392b;--amber:#b7791f;--orange:#d9772b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1b2330;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
html[lang=fr] [data-l=en],html[lang=en] [data-l=fr]{display:none!important}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;background:#fff;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.slide{position:absolute;inset:0;display:none;padding:46px 60px 54px}
.slide.on{display:block}
.slide h1{margin:0 0 6px;font-size:36px;line-height:1.15;color:var(--navy)}
.slide h2{margin:0 0 18px;font-size:20px;font-weight:400;color:var(--muted)}
.slide p,.slide li{font-size:21px;line-height:1.38}
.slide ul{margin:0;padding-left:26px}
.slide li{margin-bottom:9px}
.foot{position:absolute;left:60px;right:60px;bottom:16px;display:flex;justify-content:space-between;font-size:12.5px;color:#7a8592;border-top:1px solid var(--line);padding-top:7px}
.slide .src{font-size:13.5px;color:#6b7684;margin-top:10px;line-height:1.35}
.title{background:var(--navy);color:#fff;padding:0}
.title .in{position:absolute;left:80px;top:170px;right:80px}
.title h1{color:#fff;font-size:52px}
.title h2{color:#cfe0f5;font-size:24px}
.title .who{margin-top:46px;font-size:17px;color:#cfe0f5;line-height:1.6}
.title .bar{position:absolute;left:80px;top:140px;width:90px;height:6px;background:#f2c94c}
.divider{background:var(--navy2);color:#fff}
.divider .in{position:absolute;left:80px;top:250px;right:80px}
.divider h1{color:#fff;font-size:46px}.divider h2{color:#dbe7f7}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--soft);border-radius:10px;padding:16px 18px;border-left:6px solid var(--navy2)}
.card h3{margin:0 0 6px;font-size:21px;color:var(--navy)}
.card p{margin:0;font-size:17.5px;line-height:1.35}
.card.ok{border-left-color:var(--ok)}.card.bad{border-left-color:var(--bad)}.card.amb{border-left-color:var(--amber)}
.big{font-size:56px;font-weight:800;color:var(--navy);line-height:1}
.num .card{text-align:left}
.num .big{margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--navy)}
td.c{font-weight:800;width:56px;text-align:center}
tr.no td{color:#9aa3ad}
.chip{display:inline-block;border-radius:12px;padding:2px 10px;font-size:14px;font-weight:700;margin-right:6px}
.chip.ok{background:#e6f5ec;color:var(--ok)}.chip.bad{background:#fdecec;color:var(--bad)}.chip.c{background:#eaf1fb;color:var(--navy2)}
.frame{position:absolute;left:40px;right:40px;top:122px;bottom:44px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f4f6f9}
.frame iframe{width:100%;height:100%;border:0}
.sc .head{display:flex;align-items:baseline;gap:14px}
.sc h1{font-size:30px}
.tag{font-size:16px;font-weight:800;padding:4px 12px;border-radius:14px}
.tag.ok{background:#e6f5ec;color:var(--ok)}.tag.bad{background:#fdecec;color:var(--bad)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid4 .card{padding:11px 13px}.grid4 .card h3{font-size:17px}.grid4 .card p{font-size:14px}
.quote{border-left:6px solid #f2c94c;background:#fffbea;padding:14px 18px;font-size:20px;border-radius:6px}
svg text{font-family:Arial,Helvetica,sans-serif}
#nav{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;align-items:center;z-index:5}
#nav button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:5px 11px;cursor:pointer;font-size:14px}
#nav button.on{background:#fff;color:var(--navy)}
#count{color:#cfd8e3;font-size:13px;min-width:62px;text-align:center}
#toc{position:fixed;inset:30px;background:#fff;z-index:6;display:none;overflow:auto;padding:20px 28px;border-radius:10px}
#toc.on{display:block}
#toc a{display:block;padding:4px 0;color:var(--navy);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line)}
@media print{html,body{overflow:visible;background:#fff}#nav,#toc{display:none}#stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block;position:relative;page-break-after:always;height:720px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="toc"></div>
<div id="nav"><button id="tocb">≡</button><button id="prev">◀</button><span id="count"></span><button id="next">▶</button><button data-lang="fr" class="on">FR</button><button data-lang="en">EN</button></div>
<script>
const T=(fr,en)=>`<span data-l="fr">${fr}</span><span data-l="en">${en}</span>`;
const TS=(fr,en)=>`<tspan data-l="fr">${fr}</tspan><tspan data-l="en">${en}</tspan>`;
const B=(fr,en)=>`<div data-l="fr">${fr}</div><div data-l="en">${en}</div>`;
const DEMO=location.pathname.includes('06_Slides')?'../04_Segment_protocol_demo/segment_protocol_demo.html':'assets/segment_protocol_demo.html';
const FOOT=T('UNIKIN · Enquête de couverture vaccinale · Sankuru 2026','UNIKIN · Vaccination coverage survey · Sankuru 2026');
const S=[];
function slide(cls,html,toc){S.push({cls,html,toc})}
function std(title,sub,body,toc){slide('',`<h1>${title}</h1>${sub?`<h2>${sub}</h2>`:''}${body}`,toc||title)}
const li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';

// ------------------------------------------------------------------ opening
slide('title',`<div class="bar"></div><div class="in"><h1>${T('Parcourir le PSU','Canvassing the PSU')}</h1>
<h2>${T('Le protocole des segments compacts, pas à pas, avec les scénarios du terrain','The compact segment protocol, step by step, with the scenarios you will meet')}</h2>
<div class="who">${T('Formation des enquêteurs, chefs d\'équipe et superviseurs','Training for enumerators, team chiefs and supervisors')}<br>${T('Enquête de couverture vaccinale du Sankuru · Université de Kinshasa','Sankuru vaccination coverage survey · University of Kinshasa')}</div></div>`,T('Titre','Title'));

std(T('Ce que vous saurez faire','What you will be able to do'),'',li([
 T('Trouver le segment 1 et le parcourir structure par structure, sans en sauter une.','Find Segment 1 and sweep it structure by structure, skipping none.'),
 T('Savoir quand s\'arrêter : la cible de 6 entretiens et la règle « on finit le segment ».','Know when to stop: the target of 6 interviews and the "finish the segment" rule.'),
 T('Établir l\'éligibilité et la date de naissance, même sans carte.','Establish eligibility and the date of birth, even without a card.'),
 T('Réagir correctement : segment inondé, vide, derrière une rivière, insécurité, PSU vide.','Respond correctly: flooded, empty or river segment, insecurity, empty PSU.'),
 T('Remplir le formulaire de disposition des segments et du PSU avec le bon code.','Complete the segment and PSU disposition form with the right code.')]));

std(T('Pourquoi : chaque ménage doit avoir la même chance','Why: every household needs the same chance'),
 T('Une enquête ne représente que les ménages qui pouvaient être choisis','A survey only represents the households that could be selected'),
 `<div class="cols"><div>${li([
 T('Si l\'on reste près de la route, on rate les ménages éloignés, souvent les moins vaccinés.','If we stay near the road we miss remote households, often the least vaccinated.'),
 T('La couverture paraît alors meilleure qu\'elle ne l\'est. Aucune analyse ne peut corriger cela.','Coverage then looks better than it is. No analysis can correct that.'),
 T('Le protocole retire tout choix à l\'équipe : où commencer, quelle maison, quand s\'arrêter.','The protocol removes every choice from the team: where to start, which house, when to stop.')])}</div>
 <svg viewBox="0 0 520 380" width="520"><rect width="520" height="380" fill="#f3f5f8" rx="10"/>
 <path d="M0 300 C120 280 200 330 520 290" stroke="#b9a37a" stroke-width="22" fill="none"/>
 ${[[60,250],[130,262],[210,275],[300,272],[380,262],[460,255]].map(([x,y])=>`<path d="M${x-12} ${y+10}L${x-12} ${y-2}L${x} ${y-14}L${x+12} ${y-2}L${x+12} ${y+10}Z" fill="#2e8b57" stroke="#1f2933"/>`).join('')}
 ${[[70,80],[160,120],[260,60],[350,140],[440,90],[110,170],[300,190],[420,200]].map(([x,y])=>`<path d="M${x-12} ${y+10}L${x-12} ${y-2}L${x} ${y-14}L${x+12} ${y-2}L${x+12} ${y+10}Z" fill="#fff" stroke="#c0392b" stroke-width="2"/>`).join('')}
 <text x="20" y="352" font-size="17" fill="#2e8b57" font-weight="700">${TS('Visités : près de la route','Visited: near the road')}</text>
 <text x="20" y="30" font-size="17" fill="#c0392b" font-weight="700">${TS('Jamais visités : loin de la route','Never visited: far from the road')}</text></svg></div>`);

std(T('D\'où vient le PSU et ses segments','Where the PSU and its segments come from'),'',
 `<div class="cols"><div>${li([
 T('BGC tire les PSU à partir de données de population maillées (GRID3), proportionnellement à la population.','BGC draws PSUs from gridded population data (GRID3), with probability proportional to population.'),
 T('Chaque PSU est découpé en segments compacts, <b>numérotés au hasard</b>.','Each PSU is divided into compact segments, <b>numbered at random</b>.'),
 T('On commence par le segment 1 et on y visite <b>tous</b> les ménages ; si la cible n\'est pas atteinte, on passe au segment 2, puis 3…','Start with Segment 1 and visit <b>all</b> its households; if the target is not reached, go to Segment 2, then 3…'),
 T('C\'est le plan « à deux degrés, micro-recensement par zone » du manuel GRID3.','This is the "two-stage, area-microcensus" design in the GRID3 manual.')])}
 <p class="src">${T('Source : GRID3, <i>Designing and Implementing Gridded Population Surveys</i> (2022), plan 6, p. 45.','Source: GRID3, <i>Designing and Implementing Gridded Population Surveys</i> (2022), design 6, p. 45.')}</p></div>
 <svg viewBox="0 0 500 380" width="500">${(()=>{const n=[[7,3,10,5],[9,1,8,11],[4,12,6,2]];let o='';n.forEach((r,i)=>r.forEach((v,j)=>{o+=`<rect x="${20+j*115}" y="${20+i*115}" width="115" height="115" fill="${v===1?'#fff3c4':v===2?'#e3f3e8':'#eef1f5'}" stroke="#7d8b99" stroke-width="1.5"/><circle cx="${77+j*115}" cy="${77+i*115}" r="20" fill="#fff" stroke="#12305a" stroke-width="2.5"/><text x="${77+j*115}" y="${84+i*115}" text-anchor="middle" font-size="20" font-weight="700" fill="#12305a">${v}</text>`}));return o+'<rect x="20" y="20" width="460" height="345" fill="none" stroke="#12305a" stroke-width="5"/>'})()}</svg></div>`);

slide('num',`<h1>${T('Les chiffres à retenir','The numbers to remember')}</h1><h2>${T('Ils sont les mêmes pour toutes les équipes','They are the same for every team')}</h2>
<div class="cols3">
<div class="card ok"><div class="big">6</div><h3>${T('entretiens par PSU','interviews per PSU')}</h3><p>${T('Enfants de 12–23 mois. Cible fixée par l\'équipe le 20 nov. 2026.','Children aged 12–23 months. Target set by the team on 20 Nov 2026.')}</p></div>
<div class="card"><div class="big">1</div><h3>${T('segment de départ','starting segment')}</h3><p>${T('Toujours le segment 1, puis numéro croissant.','Always Segment 1, then ascending numbers.')}</p></div>
<div class="card amb"><div class="big">1+2</div><h3>${T('visite + revisites','visit + revisits')}</h3><p>${T('Au plus deux revisites chez un ménage absent.','At most two revisits to an absent household.')}</p></div>
<div class="card"><div class="big">≤15 m</div><h3>${T('précision GPS','GPS accuracy')}</h3><p>${T('À la porte. Attendre jusqu\'à 5 minutes si besoin.','At the door. Wait up to 5 minutes if needed.')}</p></div>
<div class="card"><div class="big">1</div><h3>${T('fiche par structure','record per structure')}</h3><p>${T('Même vide, non éligible, absente ou refusante.','Even if vacant, not eligible, absent or refusing.')}</p></div>
<div class="card"><div class="big">~10</div><h3>${T('entretiens par équipe et par jour','interviews per team per day')}</h3><p>${T('Environ 2 PSU par jour. La vitesse ne justifie jamais un saut.','About 2 PSUs a day. Speed never justifies a skip.')}</p></div></div>`,T('Les chiffres à retenir','The numbers to remember'));

std(T('Avant de partir','Before leaving'),T('Le chef d\'équipe vérifie avec chaque enquêteur la veille au soir','The team chief checks with each enumerator the evening before'),
 `<div class="cols"><div>${li([
 T('Limites du PSU et des segments visibles sur la carte du CAPI, avec les numéros.','PSU and segment boundaries visible on the CAPI map, with numbers.'),
 T('Segment 1 noté sur la fiche d\'affectation.','Segment 1 written on the assignment sheet.'),
 T('<b>Carte papier du PSU</b> : en secours si la tablette ou l\'application s\'arrête.','<b>Paper PSU map</b>: a backup if the tablet or app stops.'),
 T('Version du CAPI à jour, une soumission de test faite.','Current CAPI version, one test submission sent.')])}</div><div>${li([
 T('Téléphone et batterie externe chargés.','Phone and power bank charged.'),
 T('Formulaires de consentement en français et en otetela.','Consent forms in French and Otetela.'),
 T('Deux enquêteurs dans un PSU ? Blocs de segments écrits avant le départ.','Two enumerators in a PSU? Segment blocks written down before leaving.'),
 T('Calendrier des événements locaux préparé en formation.','Calendar of local events prepared during training.')])}
 <p class="src">${T('SOP-01, liste avant déploiement ; GRID3 (2022), section 2.1.2.2, p. 24 (carte papier).','SOP-01, pre-deployment list; GRID3 (2022), section 2.1.2.2, p. 24 (paper map).')}</p></div></div>`);

std(T('Naviguer jusqu\'au PSU','Navigating to the PSU'),'',`<div class="cols"><div>${li([
 T('Le <b>centroïde</b> sert à naviguer. On n\'interroge pas en route, ni au centroïde.','The <b>centroid</b> is for navigation. Do not interview on the way, or at the centroid.'),
 T('Vérifier que le point bleu est dans le polygone du PSU.','Check that the blue dot is inside the PSU polygon.'),
 T('Visite de courtoisie à l\'autorité locale.','Courtesy visit to the local authority.'),
 T('Trouver le segment 1 sur la carte, le comparer à la fiche d\'affectation. Désaccord ? On s\'arrête et on appelle le superviseur.','Find Segment 1 on the map and compare it with the assignment sheet. Disagreement? Stop and call the supervisor.')])}</div>
 <div class="card"><h3>${T('Outils','Tools')}</h3><p>${T('Application de navigation hors ligne (SW Maps) avec les limites du PSU et la position de l\'appareil ; carte papier en secours. Les cartes papier aident aussi à expliquer l\'enquête aux habitants et aux chefs.','Offline navigation app (SW Maps) showing the PSU boundary and the device position; a paper map as backup. Paper maps also help explain the survey to residents and leaders.')}</p>
 <p class="src">${T('GRID3 (2022), section 2.1.2.2, p. 24.','GRID3 (2022), section 2.1.2.2, p. 24.')}</p></div></div>`);

std(T('Entrer dans le segment 1 et fixer le balayage','Enter Segment 1 and fix the sweep'),'',`<div class="cols"><div>${li([
 T('Le travail commence quand le marqueur est <b>dans</b> le polygone du segment.','Work starts when the marker is <b>inside</b> the segment polygon.'),
 T('Commencer par la structure la plus proche du point d\'entrée.','Start with the structure nearest the entry point.'),
 T('Fixer un sens de balayage (serpentin) pour tout le segment et le dire au chef d\'équipe.','Fix one sweep direction (serpentine) for the whole segment and tell the team chief.'),
 T('Le sens ne change plus à l\'intérieur du segment.','The direction does not change inside the segment.')])}</div>
 <svg viewBox="0 0 500 360" width="500"><rect x="20" y="20" width="460" height="320" fill="#fff3c4" stroke="#12305a" stroke-width="4"/>
 <path d="M50 70 H450 V170 H50 V270 H450" fill="none" stroke="#1d4a85" stroke-width="3" stroke-dasharray="9 6"/>
 ${[[90,70],[170,70],[250,70],[330,70],[410,70],[410,170],[330,170],[250,170],[170,170],[90,170],[90,270],[170,270],[250,270],[330,270],[410,270]].map(([x,y],i)=>`<path d="M${x-11} ${y+9}L${x-11} ${y-2}L${x} ${y-13}L${x+11} ${y-2}L${x+11} ${y+9}Z" fill="${i<8?'#2e8b57':'#fff'}" stroke="#1f2933"/><text x="${x}" y="${y+28}" text-anchor="middle" font-size="12" fill="#5b6876">${i+1}</text>`).join('')}
 <circle cx="40" cy="55" r="9" fill="#12305a"/><text x="55" y="45" font-size="14" fill="#12305a" font-weight="700">${TS('entrée','entry')}</text></svg></div>`);

std(T('Le balayage : chaque structure, une fiche','The sweep: every structure, one record'),'',`<div class="cols"><div>${li([
 T('Aller à la structure suivante sur la ligne, une par une.','Go to the next structure on the line, one by one.'),
 T('Ne jamais sauter une structure parce qu\'elle est loin, en hauteur, clôturée, semble vide ou « sans enfant ».','Never skip a structure because it is far, uphill, fenced, looks empty or "has no child".'),
 T('Chaque structure produit une fiche, soumise <b>avant</b> d\'avancer, avec GPS ≤ 15 m à la porte.','Every structure produces a record, submitted <b>before</b> walking on, with GPS ≤ 15 m at the door.'),
 T('Une structure hors du segment appartient au segment qui la contient : pas maintenant.','A structure outside the segment belongs to the segment that contains it: not now.')])}</div>
 <div class="grid4" style="grid-template-columns:1fr 1fr">
 <div class="card ok"><h3>${T('Entretien','Interview')}</h3><p>${T('Enfant de 12–23 mois : compte pour la cible.','Child aged 12–23 months: counts toward the target.')}</p></div>
 <div class="card"><h3>${T('Non éligible','Not eligible')}</h3><p>${T('Pas d\'enfant de 0–23 mois : une fiche quand même.','No child aged 0–23 months: a record anyway.')}</p></div>
 <div class="card amb"><h3>${T('Absent','Absent')}</h3><p>${T('Fiche, puis revisite.','Record, then revisit.')}</p></div>
 <div class="card bad"><h3>${T('Refus','Refusal')}</h3><p>${T('Fiche, jamais remplacé par le voisin.','Record, never replaced by a neighbour.')}</p></div>
 <div class="card"><h3>${T('Vide ou non résidentiel','Vacant or non-residential')}</h3><p>${T('Fiche avec GPS : la preuve du passage.','Record with GPS: proof the team passed.')}</p></div>
 <div class="card"><h3>${T('Enfant 0–11 mois seulement','Child 0–11 months only')}</h3><p>${T('Entretien, hors cible.','Interview, not in the target.')}</p></div></div></div>`);

std(T('Une structure sur une limite','A structure on a boundary'),T('C\'est l\'entrée principale qui décide','The main entrance decides'),`<div class="cols"><div>${li([
 T('Limite entre deux segments : la structure appartient au segment qui contient son <b>entrée principale</b>. Noter la raison en commentaire.','Boundary between two segments: the structure belongs to the segment containing its <b>main entrance</b>. Note the reason in the comment.'),
 T('Limite du PSU : même règle ; l\'entretien a lieu et la fiche porte le signal « hors limite » pour décision.','PSU boundary: same rule; the interview goes ahead and the record carries the "out of boundary" flag for review.'),
 T('Chaque structure n\'est comptée que dans un seul segment.','Each structure is counted in one segment only.')])}
 <p class="src">${T('SOP-01, section 7. Le manuel GRID3 propose une autre règle (limites nord et est incluses) : au Sankuru, on suit la SOP.','SOP-01, section 7. The GRID3 manual suggests another rule (north and east edges included): in Sankuru we follow the SOP.')}</p></div>
 <svg viewBox="0 0 480 330" width="480"><rect x="20" y="20" width="220" height="290" fill="#fff3c4" stroke="#7d8b99" stroke-width="2"/><rect x="240" y="20" width="220" height="290" fill="#eef1f5" stroke="#7d8b99" stroke-width="2"/>
 <line x1="240" y1="20" x2="240" y2="310" stroke="#12305a" stroke-width="4" stroke-dasharray="10 6"/>
 <rect x="190" y="130" width="100" height="70" fill="#fff" stroke="#1f2933" stroke-width="2"/><rect x="200" y="170" width="18" height="30" fill="#2e8b57"/>
 <text x="130" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#12305a">${TS('Segment 1','Segment 1')}</text><text x="350" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#12305a">${TS('Segment 2','Segment 2')}</text>
 <text x="130" y="250" text-anchor="middle" font-size="16" fill="#2e8b57" font-weight="700">${TS('Porte → segment 1','Door → Segment 1')}</text></svg></div>`);

std(T('À la porte : qui est éligible ?','At the door: who is eligible?'),'',`<div class="cols"><div>${li([
 T('Un enfant de 0 à 23 mois qui <b>vit habituellement</b> ici et <b>a dormi ici la nuit dernière</b>.','A child aged 0 to 23 months who <b>usually lives</b> here and <b>slept here last night</b>.'),
 T('Les enfants de 12–23 mois comptent pour la cible ; ceux de 0–11 mois sont interrogés hors cible.','Children aged 12–23 months count toward the target; those aged 0–11 months are interviewed outside it.'),
 T('Il faut la mère ou la gardienne qui décide des vaccins. Si elle est absente, on n\'interroge pas une autre personne : on revient.','The mother or caregiver who decides on vaccination is needed. If she is away, do not interview someone else: come back.'),
 T('Le consentement est lu en entier, chaque fois.','Consent is read in full, every time.')])}</div>
 <div class="card"><h3>${T('Pourquoi cette règle','Why this rule')}</h3><p>${T('L\'âge décide de l\'éligibilité. Une erreur d\'âge fait entrer ou sortir un enfant de l\'échantillon.','Age decides eligibility. A mistake on age puts a child into or out of the sample.')}</p>
 <p class="src">${T('OMS (2018), manuel de référence des enquêtes de couverture, section 4.1.2.','WHO (2018), vaccination coverage cluster surveys reference manual, section 4.1.2.')}</p></div></div>`);

std(T('Trouver la date de naissance','Finding the date of birth'),T('Dans cet ordre','In this order'),`<div class="cols3">
 <div class="card ok"><div class="big">1</div><h3>${T('Carte de vaccination','Vaccination card')}</h3><p>${T('La meilleure source. Recopier la date telle qu\'écrite.','The best source. Copy the date as written.')}</p></div>

 <div class="card"><h3>4. DQM</h3><p>${T('Revue indépendante, contre-enquêtes, audit de couverture des segments.','Independent review, back-checks, segment coverage audit.')}</p></div></div>
 <div class="quote" style="margin-top:24px">${T('Un doute sur le terrain ? Appelez le superviseur avant de quitter le ménage : corriger sur place est facile, corriger après est presque impossible.','In doubt in the field? Call the supervisor before leaving the household: fixing it on the spot is easy, fixing it afterwards is almost impossible.')}</div>`);

std(T('À vous : quel code ?','Your turn: which code?'),T('Répondez sans regarder les diapositives précédentes','Answer without looking back'),`<div class="grid4" style="grid-template-columns:1fr 1fr">
 <div class="card"><h3>1</h3><p>${T('La 6e interview arrive à la 5e maison du segment 1, qui en compte 12.','The 6th interview comes at house 5 of Segment 1, which has 12.')}</p></div>
 <div class="card"><h3>2</h3><p>${T('Le segment 3 est un marché sans habitation ; l\'équipe le parcourt en entier.','Segment 3 is a market with no dwelling; the team walks all of it.')}</p></div>
 <div class="card"><h3>3</h3><p>${T('La piste vers le segment 2 est sous l\'eau ; le superviseur a donné son accord.','The track to Segment 2 is under water; the supervisor has approved.')}</p></div>
 <div class="card"><h3>4</h3><p>${T('Les 5 segments sont faits ; 4 entretiens seulement.','All 5 segments are done; only 4 interviews.')}</p></div></div>
 <p class="src" style="font-size:15px">${T('Réponses : 1. finir le segment 1 (A, PSU 1) · 2. C1 · 3. D1 (PSU 2) · 4. PSU 6, jamais hors du PSU.','Answers: 1. finish Segment 1 (A, PSU 1) · 2. C1 · 3. D1 (PSU 2) · 4. PSU 6, never outside the PSU.')}</p>`);

std(T('À retenir','Key points'),'',li([
 T('Segment 1, puis numéro croissant. Personne ne choisit.','Segment 1, then ascending numbers. Nobody chooses.'),
 T('Chaque structure, une fiche, soumise à la porte avec GPS.','Every structure, one record, submitted at the door with GPS.'),
 T('6 entretiens, mais on finit toujours le segment en cours.','6 interviews, but always finish the current segment.'),
 T('Une visite et deux revisites ; un refus n\'est jamais remplacé.','One visit and two revisits; a refusal is never replaced.'),
 T('Un segment ne se saute qu\'avec le superviseur, avec un sous-code, une photo et un visa.','A segment is skipped only with the supervisor, with a sub-code, a photo and an approval.'),
 T('Le code écrit doit correspondre à la carte des points GPS.','The code written must match the map of GPS points.')])+
 `<p class="src" style="margin-top:22px">${T('Sources : Protocole d\'étude Sankuru V1.0 ; SOP-01 V1.0 ; formulaire de disposition V2 ; OMS, manuel de référence des enquêtes de couverture vaccinale (2018) ; GRID3, <i>Designing and Implementing Gridded Population Surveys</i> (2022).','Sources: Sankuru Study Protocol V1.0; SOP-01 V1.0; disposition form V2; WHO vaccination coverage cluster surveys reference manual (2018); GRID3, <i>Designing and Implementing Gridded Population Surveys</i> (2022).')}</p>`);

// ------------------------------------------------------------------ player
const st=document.getElementById('stage');
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide '+(s.cls||'');d.innerHTML=s.html+(s.cls==='title'||s.cls==='divider'?'':`<div class="foot"><span>${FOOT}</span><span>${i+1}</span></div>`);st.appendChild(d)});
const slides=[...st.children];let cur=0;
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720)*.98;st.style.transform=`translate(-50%,-50%) scale(${k})`}
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>{s.classList.toggle('on',j===cur);
    const f=s.querySelector('.frame');if(f){if(j===cur&&!f.firstChild){const ifr=document.createElement('iframe');ifr.src=f.dataset.src+'&lang='+document.documentElement.lang;ifr.title='animation';f.appendChild(ifr)}if(j!==cur&&f.firstChild)f.innerHTML=''}});
  document.getElementById('count').textContent=`${cur+1} / ${slides.length}`;try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
function setLang(l){document.documentElement.lang=l;document.querySelectorAll('#nav [data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  const f=slides[cur].querySelector('.frame');if(f)f.innerHTML='';show(cur);buildToc();try{localStorage.setItem('slang',l)}catch(e){}}
function buildToc(){const t=document.getElementById('toc');t.innerHTML='';S.forEach((s,i)=>{const a=document.createElement('a');a.href='#';a.innerHTML=`${i+1}. ${s.toc||''}`;a.onclick=e=>{e.preventDefault();t.classList.remove('on');show(i)};t.appendChild(a)})}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('tocb').onclick=()=>document.getElementById('toc').classList.toggle('on');
document.querySelectorAll('#nav [data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);
  if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
addEventListener('resize',fit);fit();addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n&&n-1!==cur)show(n-1)});
let l0='fr';try{l0=localStorage.getItem('slang')||'fr'}catch(e){}const ql=new URLSearchParams(location.search).get('lang');if(ql)l0=ql;
document.documentElement.lang=l0;document.querySelectorAll('#nav [data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l0));
buildToc();show((parseInt(location.hash.slice(1))||1)-1);
</script>
